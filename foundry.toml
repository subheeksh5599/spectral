[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }
gas_reports = ["Spectral"]

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
xlayer_testnet = "${XLAYER_TESTNET_RPC}"
